# Render Blueprint for WeaboTalk (see DOCUMENTS/DEPLOYMENT.md)
# Database and image storage are on Supabase; Render only runs the Rails app.
services:
  - type: web
    name: weabo-talk
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Pick the region closest to your Supabase project (e.g. Supabase ap-southeast-1 -> singapore)
    region: singapore
    plan: free
    healthCheckPath: /up
    envVars:
      # Rails
      - key: SECRET_KEY_BASE
        generateValue: true
      # Thruster (in the Dockerfile CMD) listens here and proxies to Puma on port 3000
      - key: HTTP_PORT
        value: 10000
      - key: PORT
        value: 10000

      # App URL, used in email links (e.g. weabo-talk.onrender.com, without https://)
      - key: APP_HOST
        sync: false
      - key: APP_PROTOCOL
        value: https

      # Supabase Postgres: "Session pooler" connection string
      - key: DATABASE_URL
        sync: false

      # Supabase Storage (S3 connection)
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

      # Email (SMTP)
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
